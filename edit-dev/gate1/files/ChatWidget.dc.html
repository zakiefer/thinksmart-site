<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<style>
  @media (max-width: 600px), (pointer: coarse) { input[placeholder="Type your message…"] { font-size: 16px !important; } }
  @media (max-height: 500px) {
    [data-ref="chatPanel"] { top: 12px !important; bottom: 12px !important; height: auto !important; }
    [data-ref="chatLauncher"][aria-expanded="true"] { display: none !important; }
  }
  @keyframes tsChatBlink { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
  @keyframes tsChatUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes tsChatDot { 0%, 80%, 100% { transform: translateY(0); opacity: .4; } 40% { transform: translateY(-4px); opacity: 1; } }
</style>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
</helmet>

<div>
  <button data-ref="chatLauncher" onClick="{{ toggle }}" aria-label="{{ launcherLabel }}" aria-expanded="{{ open }}" style="position:fixed; bottom:24px; right:24px; z-index:96; display:flex; align-items:center; gap:11px; background:#F09A2E; color:#0B0E13; border:none; padding:16px 22px; border-radius:999px; cursor:pointer; box-shadow:0 12px 32px rgba(0,0,0,.45); font-family:'Archivo','Helvetica Neue',sans-serif; font-weight:800; font-size:13px; letter-spacing:.14em; text-transform:uppercase; transition:background .25s ease, transform .25s ease;" style-hover="background:#FFB042; transform:translateY(-2px);">
    <span style="width:9px; height:9px; border-radius:50%; background:#0B0E13; display:inline-block; animation:tsChatBlink 2.2s ease infinite;"></span>
    <span>{{ launcherLabel }}</span>
  </button>
  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <div data-ref="chatPanel" role="dialog" aria-label="Message Think Smart" tabindex="-1" style="outline:none; position:fixed; bottom:104px; right:clamp(16px,4vw,24px); z-index:96; width:min(380px, calc(100vw - 32px)); height:min(540px, 72vh); background:#10141B; border:1px solid rgba(235,229,216,.18); border-radius:6px; box-shadow:0 24px 64px rgba(0,0,0,.55); display:flex; flex-direction:column; overflow:hidden; animation:tsChatUp .35s cubic-bezier(.22,1,.36,1) both; font-family:'Archivo','Helvetica Neue',sans-serif;">
      <div style="display:flex; align-items:center; gap:14px; padding:16px 18px; background:#070A0F; border-bottom:1px solid rgba(235,229,216,.12);">
        <span style="width:42px; height:42px; border-radius:50%; background:#0B0E13; border:1px solid rgba(240,154,46,.5); display:flex; align-items:center; justify-content:center; flex:none;"><img src="media/mark.webp" alt="" style="width:26px; height:26px; object-fit:contain; display:block;"></span>
        <div style="display:flex; flex-direction:column; gap:3px; min-width:0;">
          <span style="font-weight:700; font-size:14px; letter-spacing:.06em; color:#EBE5D8; text-transform:uppercase;">Think Smart — Direct Line</span>
          <span style="display:flex; align-items:center; gap:7px; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em; color:rgba(235,229,216,.65);"><span style="width:7px; height:7px; border-radius:50%; background:#F09A2E; display:inline-block; animation:tsChatBlink 2.2s ease infinite;"></span>GOES STRAIGHT TO OUR ADJUSTERS</span>
        </div>
        <button onClick="{{ toggle }}" aria-label="Close chat" style="margin-left:auto; background:transparent; border:none; color:rgba(235,229,216,.6); font-size:22px; line-height:1; cursor:pointer; padding:6px;" style-hover="color:#F09A2E;">×</button>
      </div>
      <div data-ref="chatScroll" role="log" aria-live="polite" aria-label="Conversation" style="flex:1; overflow-y:auto; padding:18px 16px; display:flex; flex-direction:column; gap:12px; background:linear-gradient(180deg, #0B0E13 0%, #10141B 100%);">
        <sc-for list="{{ messages }}" as="m" hint-placeholder-count="1">
          <div style="display:flex; flex-direction:column; max-width:82%; align-self:{{ m.align }};">
            <span style="font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.18em; color:rgba(235,229,216,.65); margin:0 4px 5px;">{{ m.who }}</span>
            <span style="padding:12px 14px; border-radius:{{ m.radius }}; background:{{ m.bg }}; color:{{ m.color }}; font-size:14px; line-height:1.55; border:{{ m.border }}; overflow-wrap:anywhere; word-break:break-word;">{{ m.text }}</span>
          </div>
        </sc-for>
        <sc-if value="{{ typing }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex; gap:5px; align-self:flex-start; background:#161B24; border:1px solid rgba(235,229,216,.12); padding:13px 16px; border-radius:2px 10px 10px 10px;">
            <span style="width:6px; height:6px; border-radius:50%; background:#F09A2E; animation:tsChatDot 1.1s ease infinite;"></span>
            <span style="width:6px; height:6px; border-radius:50%; background:#F09A2E; animation:tsChatDot 1.1s ease .15s infinite;"></span>
            <span style="width:6px; height:6px; border-radius:50%; background:#F09A2E; animation:tsChatDot 1.1s ease .3s infinite;"></span>
          </div>
        </sc-if>
      </div>
      <div style="display:flex; gap:10px; padding:14px 14px; border-top:1px solid rgba(235,229,216,.12); background:#0B0E13;">
        <input ref="{{ inputRef }}" onKeyDown="{{ keydown }}" type="text" aria-label="Your message" placeholder="Type your message…" style="flex:1; background:#10141B; border:1px solid rgba(235,229,216,.18); color:#EBE5D8; padding:13px 14px; border-radius:2px; font-size:14px; font-family:'Archivo',sans-serif; outline:none; min-width:0;" style-focus="border-color:#F09A2E;">
        <button onClick="{{ send }}" style="background:#F09A2E; color:#0B0E13; border:none; font-weight:700; font-size:12px; letter-spacing:.12em; text-transform:uppercase; font-family:'Archivo',sans-serif; padding:0 18px; border-radius:2px; cursor:pointer; transition:background .25s ease;" style-hover="background:#FFB042;">Send</button>
      </div>
      <div style="padding:9px 14px; background:#070A0F; border-top:1px solid rgba(235,229,216,.08); display:flex; flex-wrap:wrap; justify-content:space-between; gap:6px 10px;">
        <span style="font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.16em; color:rgba(235,229,216,.52);">FREE · NO OBLIGATION</span>
        <a href="tel:8127745049" style="font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.16em; color:#F09A2E; text-decoration:none; white-space:nowrap;">URGENT? 812-774-5049</a>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 420, &quot;height&quot;: 640}}">
class Component extends DCLogic {
  state = {
    open: false,
    typing: false,
    step: 'intro',
    askedForContact: false,
    messages: [
      { me: false, text: "Tell us what happened to your property and how to reach you. This isn't a live chat — your message goes straight to a licensed adjuster, who will call or write back." }
    ]
  };

  componentDidMount() {
    this._inputRef = React.createRef();
    this._timers = [];
    this._onKey = (e) => {
      if (e.key !== 'Escape' || !this.state.open || e.defaultPrevented) return;
      const panel = document.querySelector('[data-ref="chatPanel"]');
      const launcher = document.querySelector('[data-ref="chatLauncher"]');
      if ((panel && panel.contains(e.target)) || e.target === launcher) this._setOpen(false);
    };
    document.addEventListener('keydown', this._onKey);
  }

  _setOpen(open) {
    const launcher = document.querySelector('[data-ref="chatLauncher"]');
    const panel = document.querySelector('[data-ref="chatPanel"]');
    const active = document.activeElement;
    const focusInChat = !active || active === document.body || active === launcher || (panel && panel.contains(active));
    this.setState({ open: open }, () => {
      if (open) {
        const fine = window.matchMedia && window.matchMedia('(pointer: fine)').matches;
        const input = this._inputRef && this._inputRef.current;
        const dialog = document.querySelector('[data-ref="chatPanel"]');
        if (fine && input) input.focus();
        else if (dialog) dialog.focus();
      } else if (focusInChat && launcher) {
        const now = document.activeElement;
        if (!now || now === document.body || now === launcher) launcher.focus();
      }
    });
  }

  componentDidUpdate() {
    const sc = document.querySelector('[data-ref="chatScroll"]');
    if (sc) sc.scrollTop = sc.scrollHeight;
  }

  componentWillUnmount() {
    (this._timers || []).forEach((t) => clearTimeout(t));
    if (this._onKey) document.removeEventListener('keydown', this._onKey);
  }

  _bot(text, delay) {
    this.setState({ typing: true });
    const t = setTimeout(() => {
      this.setState((s) => ({ messages: s.messages.concat([{ me: false, text: text }]), typing: false }));
    }, delay || 900);
    this._timers.push(t);
  }

  // A phone-shaped or email-shaped token — not just "lots of digits", which would
  // also match dates, dollar amounts, ZIP codes and claim numbers.
  _looksLikeContact(raw) {
    const text = raw.replace(/[\u200e\u200f\u202a-\u202e\u2066-\u2069]/g, '').replace(/[\u2010-\u2015\u2212\ufe63\uff0d]/g, '-').replace(/[\u00a0\u2007\u202f]/g, ' ');
    const ownPhones = ['8127745049', '8128501050'];
    const phones = text.match(/(?:^|\D)(?:\+?1[\s.\-]*)?\(?[2-9]\d{2}\)?\s*[\s.\-\/]?\s*[2-9]\d{2}\s*[\s.\-]?\s*\d{4}(?!\d)/g) || [];
    const phone = phones.some((p) => ownPhones.indexOf(p.replace(/\D/g, '').slice(-10)) === -1);
    const emails = text.match(/[A-Za-z0-9._%+\-]+@[A-Za-z0-9\-]+(?:\.[A-Za-z0-9\-]+)*\.[A-Za-z]{2,}/g) || [];
    const host = location.hostname.replace(/^www\./, '').toLowerCase();
    const email = emails.some((e) => {
      const lower = e.toLowerCase();
      return lower !== 'thinksmartpublicadjusting@gmail.com' && !(host && lower.slice(-(host.length + 1)) === '@' + host);
    });
    return phone || email;
  }

  _deliver(kind) {
    const full = this.state.messages
      .map((m) => (m.me ? 'Visitor: ' : 'Think Smart: ') + m.text)
      .join('\n');
    // Keep the newest part of a very long chat: that is where the phone number is.
    let tail = full.slice(-12000);
    if (/^[\uDC00-\uDFFF]/.test(tail)) tail = tail.slice(1);
    const transcript = full.length > 12000 ? '[earlier messages trimmed]\n' + tail : full;
    const emailSend = fetch('https://formsubmit.co/ajax/thinksmartpublicadjusting@gmail.com', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({
        _subject: 'Website chat — ' + kind,
        _template: 'table',
        _captcha: 'false',
        'Chat transcript': transcript,
        'Sent from': location.href
      })
    })
      .then((r) => r.json().then((d) => r.ok && d && String(d.success) === 'true'))
      .catch(() => false);
    const dbStore = fetch('https://ptvgxvvmvtzsgmqdixef.supabase.co/rest/v1/website_leads', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': 'sb_publishable_dL2UsKU4RtA0AGB73wS19w_91PBsbOe',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({ kind: 'chat', payload: { stage: kind, transcript: transcript, page: location.href } })
    })
      .then((r) => r.ok)
      .catch(() => false);
    // Same-origin PHP mailer: active on the business's own hosting, fails closed elsewhere.
    const serverSend = fetch('send-lead.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({ kind: 'chat', payload: { 'Stage': kind, 'Chat transcript': transcript, 'Sent from': location.href } })
    })
      .then((r) => (r.ok ? r.json().then((d) => !!(d && d.success === true)) : false))
      .catch(() => false);
    // Resolve as soon as any channel delivers; give up on a channel after 15s.
    return new Promise((resolve) => {
      const ps = [serverSend, emailSend, dbStore];
      let left = ps.length;
      ps.forEach((p) => Promise.race([p, new Promise((r) => setTimeout(() => r(false), 15000))])
        .then((ok) => { if (ok) resolve(true); else if (--left === 0) resolve(false); }));
    });
  }

  _failText() {
    return "We couldn't send that just now — please call 812-774-5049 or email thinksmartpublicadjusting@gmail.com and a licensed adjuster will pick it up.";
  }

  _finishDelivery(ok, botText, extraState) {
    this._delivering = false;
    const flush = this._queued;
    this._queued = false;
    this.setState((s) => Object.assign(
      { typing: false, messages: s.messages.concat([{ me: false, text: botText }]) },
      extraState
    ), () => {
      // messages typed while the send was in flight go out as a normal follow-up
      if (flush && ok) this._sendFollowup();
    });
  }

  _sendLead() {
    // a pending "what's your number?" reply would now arrive after the confirmation
    (this._timers || []).forEach((t) => clearTimeout(t));
    this._timers = [];
    this._delivering = true;
    this.setState({ typing: true });
    this._deliver('new lead').then((ok) => {
      if (ok) this._leadSent = true;
      const successText = this._contactSeen
        ? "Done — your message is with our team. A licensed adjuster will call or write back shortly. Urgent? Call 812-774-5049 and we'll pick up."
        : "Done — your message is with our team. We don't see a callback number in it though — drop your number here, or call 812-774-5049 so an adjuster can reach you.";
      this._finishDelivery(ok, ok ? successText : this._failText(), { step: 'ready' });
    });
  }

  _sendFollowup() {
    this._delivering = true;
    this.setState({ typing: true });
    const kind = this._leadSent ? 'follow-up' : 'new lead';
    this._deliver(kind).then((ok) => {
      if (ok) this._leadSent = true;
      this._finishDelivery(ok, ok ? 'Passed along — anything else we should know?' : this._failText(), {});
    });
  }

  _send() {
    const el = this._inputRef && this._inputRef.current;
    if (!el) return;
    const text = (el.value || '').trim();
    if (!text) return;
    el.value = '';
    const hasContact = this._looksLikeContact(text);
    if (hasContact) this._contactSeen = true;
    this.setState((s) => ({ messages: s.messages.concat([{ me: true, text: text }]) }), () => {
      if (this._delivering) { this._queued = true; return; }
      const step = this.state.step;
      if (step === 'intro') {
        if (hasContact) { this._sendLead(); return; }
        this.setState({ step: 'contact' });
        this._bot("Got it. What's the best phone number (or email) for a licensed adjuster to reach you?");
      } else if (step === 'contact') {
        if (hasContact || this.state.askedForContact) {
          this._sendLead();
        } else {
          this.setState({ askedForContact: true });
          this._bot("A callback number or email is all we need — we'll take it from there.");
        }
      } else {
        this._sendFollowup();
      }
    });
  }

  renderVals() {
    const decorate = (m) => ({
      text: m.text,
      who: m.me ? 'YOU' : 'THINK SMART',
      align: m.me ? 'flex-end' : 'flex-start',
      bg: m.me ? '#F09A2E' : '#161B24',
      color: m.me ? '#0B0E13' : 'rgba(235,229,216,.88)',
      border: m.me ? 'none' : '1px solid rgba(235,229,216,.12)',
      radius: m.me ? '10px 2px 10px 10px' : '2px 10px 10px 10px'
    });
    return {
      open: this.state.open,
      typing: this.state.typing,
      messages: this.state.messages.map(decorate),
      launcherLabel: this.state.open ? 'Close chat' : "Let's chat",
      inputRef: this._inputRef,
      toggle: () => this._setOpen(!this.state.open),
      send: () => this._send(),
      keydown: (e) => { if (e.key === 'Enter') this._send(); }
    };
  }
}
</script>
</body>
</html>
